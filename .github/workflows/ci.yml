name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_RELEASE_SUMMARY: |-
    Test "release" summary
    * Multiple lines

jobs:
  unit-tests:
    name: Unit tests / esphome:${{ matrix.esphome-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        esphome-version:
          - stable
          - beta
          - dev
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run unit tests inside esphome:${{ matrix.esphome-version }}
        run: |-
          docker run --rm \
            --workdir /github/workspace \
            -v "$(pwd)":"/github/workspace" \
            --entrypoint python \
            ghcr.io/esphome/esphome:${{ matrix.esphome-version }} \
            -m unittest discover -s tests -p 'test_*.py' -v

  build:
    name: esphome:${{ matrix.esphome-version }} / ${{ matrix.manifest }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        esphome-version:
          - stable
          - beta
          - dev
        manifest:
          - complete
          - partial
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run action
        uses: ./
        id: esphome-build
        with:
          yaml-file: tests/test.yaml
          version: ${{ matrix.esphome-version }}
          release-summary: ${{ env.TEST_RELEASE_SUMMARY }}
          release-url: "https://github.com/esphome/build-action"
          complete-manifest: ${{ matrix.manifest == 'complete' }}
      - name: Write version to file
        run: echo ${{ steps.esphome-build.outputs.version }} > ${{ steps.esphome-build.outputs.name }}/version
      - name: Upload ESPHome binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output-files-${{ matrix.esphome-version }}-${{ matrix.manifest }}-${{ matrix.os }}
          path: ${{ steps.esphome-build.outputs.name }}

  verify:
    name: Verify output files for esphome:${{ matrix.esphome-version }} with ${{ matrix.manifest }} manifest
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        esphome-version:
          - stable
          - beta
          - dev
        manifest:
          - complete
          - partial
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-files-${{ matrix.esphome-version }}-${{ matrix.manifest }}-${{ matrix.os }}

      - name: List files
        run: |-
          ls -al
          tree

      - name: Validate json file matches ${{ matrix.manifest }} manifest-template.json
        run: |
          jq -n \
            --arg ota_md5 "$(md5sum test-esp32.ota.bin | head -c 32)" \
            --arg ota_sha256 "$(sha256sum test-esp32.ota.bin | head -c 64)" \
            --arg factory_md5 "$(md5sum test-esp32.factory.bin | head -c 32)" \
            --arg factory_sha256 "$(sha256sum test-esp32.factory.bin | head -c 64)" \
            -f tests/${{ matrix.manifest }}-manifest-template.json > /tmp/manifest.json
          diff <(jq --sort-keys . /tmp/manifest.json) <(jq --sort-keys . manifest.json)

  build-platforms:
    name: ${{ matrix.platform }} / esphome:${{ matrix.esphome-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        esphome-version:
          - stable
          - beta
          - dev
        platform:
          - rp2
          - bk72xx
        include:
          - platform: rp2
            expected-name: test-rp2-rp2040
            chip-family: RP2040
            ota-file: test-rp2-rp2040.ota.bin
          - platform: bk72xx
            expected-name: test-bk72xx-bk7231n
            chip-family: BK7231N
            ota-file: test-bk72xx-bk7231n.uf2
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run action
        uses: ./
        id: esphome-build
        with:
          yaml-file: tests/test-${{ matrix.platform }}.yaml
          version: ${{ matrix.esphome-version }}
          release-summary: ${{ env.TEST_RELEASE_SUMMARY }}
          release-url: "https://github.com/esphome/build-action"
      - name: List files
        run: |-
          ls -al ${{ steps.esphome-build.outputs.name }}
      - name: Verify output files
        run: |
          name="${{ steps.esphome-build.outputs.name }}"
          [ "$name" = "${{ matrix.expected-name }}" ]
          test -f "$name/$name.uf2"
          test -f "$name/$name.elf"
          test -f "$name/${{ matrix.ota-file }}"
          jq -e \
            --arg chip "${{ matrix.chip-family }}" \
            --arg ota_path "${{ matrix.ota-file }}" \
            --arg ota_md5 "$(md5sum "$name/${{ matrix.ota-file }}" | head -c 32)" \
            --arg ota_sha256 "$(sha256sum "$name/${{ matrix.ota-file }}" | head -c 64)" \
            '.chipFamily == $chip
              and .ota.path == $ota_path
              and .ota.md5 == $ota_md5
              and .ota.sha256 == $ota_sha256
              and .ota.release_url == "https://github.com/esphome/build-action"
              and (.parts | not)' \
            "$name/manifest.json"

  build-host:
    name: host / esphome:${{ matrix.esphome-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        esphome-version:
          - stable
          - beta
          - dev
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run action
        uses: ./
        id: esphome-build
        with:
          yaml-file: tests/test-host.yaml
          version: ${{ matrix.esphome-version }}
      - name: List files
        run: |-
          ls -al ${{ steps.esphome-build.outputs.name }}
      - name: Verify output files
        run: |
          name="${{ steps.esphome-build.outputs.name }}"
          [ "$name" = "test-host-host" ]
          test -x "$name/$name"
          file "$name/$name" | grep -q "ELF"
          [ ! -e "$name/manifest.json" ]
          [ ! -e "$name/$name.elf" ]

  version-gate:
    name: Reject unsupported ESPHome version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run action with too-old version
        uses: ./
        id: esphome-build
        continue-on-error: true
        with:
          yaml-file: tests/test.yaml
          version: "2026.6.3"
      - name: Assert the action failed
        run: |
          [ "${{ steps.esphome-build.outcome }}" = "failure" ]

  build-substitutions:
    name: substitutions / esphome:${{ matrix.esphome-version }} / ${{ matrix.manifest }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        esphome-version:
          - stable
          - beta
          - dev
        manifest:
          - complete
          - partial
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run action
        uses: ./
        id: esphome-build
        with:
          yaml-file: tests/test-substitutions.yaml
          version: ${{ matrix.esphome-version }}
          release-summary: ${{ env.TEST_RELEASE_SUMMARY }}
          release-url: "https://github.com/esphome/build-action"
          complete-manifest: ${{ matrix.manifest == 'complete' }}
          substitutions: |
            device_name=test-substitutions
            board=esp32dev
      - name: Write version to file
        run: echo ${{ steps.esphome-build.outputs.version }} > ${{ steps.esphome-build.outputs.name }}/version
      - name: Upload ESPHome binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output-substitutions-${{ matrix.esphome-version }}-${{ matrix.manifest }}-${{ matrix.os }}
          path: ${{ steps.esphome-build.outputs.name }}

  verify-substitutions:
    name: Verify substitutions output for esphome:${{ matrix.esphome-version }} with ${{ matrix.manifest }} manifest
    runs-on: ${{ matrix.os }}
    needs: build-substitutions
    strategy:
      fail-fast: false
      matrix:
        esphome-version:
          - stable
          - beta
          - dev
        manifest:
          - complete
          - partial
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-substitutions-${{ matrix.esphome-version }}-${{ matrix.manifest }}-${{ matrix.os }}
      - name: List files
        run: |-
          ls -al
          tree
      - name: Validate json file matches ${{ matrix.manifest }} substitutions-manifest-template.json
        run: |
          jq -n \
            --arg ota_md5 "$(md5sum test-substitutions-esp32.ota.bin | head -c 32)" \
            --arg ota_sha256 "$(sha256sum test-substitutions-esp32.ota.bin | head -c 64)" \
            --arg factory_md5 "$(md5sum test-substitutions-esp32.factory.bin | head -c 32)" \
            --arg factory_sha256 "$(sha256sum test-substitutions-esp32.factory.bin | head -c 64)" \
            -f tests/${{ matrix.manifest }}-substitutions-manifest-template.json > /tmp/manifest.json
          diff <(jq --sort-keys . /tmp/manifest.json) <(jq --sort-keys . manifest.json)